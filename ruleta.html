<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubre al capitán de tu mesa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 5px; font-size: 1.8rem; }
        #subtituloMesa { font-size: 1.1rem; color: #ffcc00; margin-bottom: 20px; font-weight: bold; }
        .ruleta-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        canvas.sin-transicion {
            transition: none;
        }
        .flecha {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ffcc00;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }
        button {
            background-color: #ffcc00;
            color: #333;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
            margin-top: 15px;
        }
        button:active { transform: scale(0.95); }
        button:hover { background-color: #ffd633; }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
            box-shadow: none;
        }
        #resultado {
            margin-top: 20px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 40px;
            color: #ffcc00;
        }
        #listaCapitanes {
            margin-top: 5px;
            font-size: 1rem;
            color: white;
            min-height: 20px;
        }
        .volver {
            margin-top: 15px;
            background: none;
            border: 2px solid white;
            color: white;
            padding: 8px 20px;
            font-size: 0.9rem;
            border-radius: 20px;
        }
        .volver:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <h1>Descubre al capitán</h1>
    <div id="subtituloMesa">Mesa X</div>

    <div class="ruleta-container">
        <div class="flecha"></div>
        <canvas id="canvasRuleta" width="400" height="400"></canvas>
    </div>

    <button id="btnGirar" onclick="girarRuleta()">¡GIRAR!</button>
    <div id="resultado"></div>
    <div id="listaCapitanes"></div>

    <button class="volver" onclick="window.location.href='index.html'">Cambiar de mesa</button>

    <script>
        // 1. Capturar el número de mesa de la URL (por defecto la mesa 1 si no hay nada)
        const urlParams = new URLSearchParams(window.location.search);
        const numeroMesa = urlParams.get('mesa') || '1';
        document.getElementById('subtituloMesa').innerText = `Mesa ${numeroMesa}`;

        // 2. Definir las listas de nombres por cada mesa y quién(es) gana(n).
        //    "capitanes" es la lista de nombres que deben salir, en el orden en que
        //    quieres que se vayan revelando. Pon solo uno si la mesa tiene un único
        //    capitán, o varios si quieres varias tiradas para esa mesa.
        const configuracionMesas = {
            "31": {
                nombres: ["Mari", "Fernando", "Dulce", "Marce", "David", "Rosa", "Ángel", "Natalia", "Sergio"],
                capitanes: ["Rosa"]
            },
            "32": {
                nombres: ["Abuela M.ª Carmen", "Paco", "M.ª Carmen", "María", "Gemma", "Nieves", "Paya"],
                capitanes: ["Paco"]
            },
            "33": {
                nombres: ["Marta", "Juanjo", "Mª Dolores", "Domingo", "Gema", "José", "Romualda", "Isa", "Gabriel"],
                capitanes: ["Mª Dolores"]
            },
            "34": {
                nombres: ["Lola", "Marcelino", "M.ª Elena", "Alberto", "Elena", "Alberto hijo", "Isabel"],
                capitanes: ["Elena"]
            },
            "41": {
                nombres: ["Isa", "Pascual Moxica", "Mercedes", "Pascual Escobar", "Rosa", "Ramón", "Bienve", "Salva", "Mari", "José", "Rosario"],
                capitanes: ["Rosa"]
            },
            "42": {
                nombres: ["Sonia", "David Jr", "Davisuco", "Rumal", "Juan Antonio", "Marisol", "David", "Elena", "Víctor"],
                capitanes: ["Elena"]
            },
            "43": {
                nombres: ["Aitana", "Chema", "Andrea", "Javi", "Leyre", "Pablo", "Esther", "Jorge", "Raúl", "Clemente"],
                capitanes: ["Javi"]
            },
            "44": {
                nombres: ["Mamen", "Sergio", "Sonia", "Francisco", "Pablo", "Carolina", "Alberto"],
                capitanes: ["Pablo"]
            },
            "51": {
                nombres: ["Loli", "Rocio", "Aaron", "Celia", "Marta", "Alejandro", "Laura", "Francisco", "Yasmine", 
                "Daniel", "Mireia", "Pedro", "Paula", "Carlos", "Claudia", "Jorge"],
                capitanes: ["Loli", "Pedro"]
            },
            "54": {
                nombres: ["Rosi", "Francisco", "Marina", "Andy", "Claudia", "Susi", "Juanma", "Vicky", "Amparo", "Pedro"],
                capitanes: ["Marina"]
            },
        };

        // Si la mesa introducida no está en el listado, ponemos una por defecto para que no falle
        const datosMesa = configuracionMesas[numeroMesa] || {
            nombres: ["Participante 1", "Participante 2", "Participante 3"],
            capitanes: ["Participante 1"]
        };

        // Copia de trabajo de los nombres: se irán eliminando de aquí los que ya han ganado
        let nombresRestantes = [...datosMesa.nombres];
        const capitanesObjetivo = datosMesa.capitanes;
        const capitanesEncontrados = [];
        let tiradaActual = 0; // índice dentro de capitanesObjetivo

        // Configuración de la ruleta
        const canvas = document.getElementById('canvasRuleta');
        const ctx = canvas.getContext('2d');
        let numSectores = nombresRestantes.length;
        let arco = 2 * Math.PI / numSectores;
        let anguloActual = 0;
        let girando = false;

        const colores = [
            "#e74c3c", "#3498db", "#2ecc71", "#f1c40f",
            "#9b59b6", "#e67e22", "#1abc9c", "#34495e",
            "#d35400", "#27ae60", "#2980b9", "#8e44ad"
        ];

        function dibujarRuleta() {
            numSectores = nombresRestantes.length;
            arco = 2 * Math.PI / numSectores;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centro = canvas.width / 2;
            const radio = centro - 10;

            for (let i = 0; i < numSectores; i++) {
                const anguloInicio = anguloActual + i * arco;
                const anguloFin = anguloInicio + arco;

                ctx.beginPath();
                ctx.moveTo(centro, centro);
                ctx.arc(centro, centro, radio, anguloInicio, anguloFin);
                ctx.fillStyle = colores[i % colores.length];
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(centro, centro);
                ctx.rotate(anguloInicio + arco / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 16px sans-serif";
                ctx.fillText(nombresRestantes[i], radio - 20, 6);
                ctx.restore();
            }
        }

        function actualizarListaCapitanes() {
            if (capitanesObjetivo.length > 1 && capitanesEncontrados.length > 0) {
                document.getElementById('listaCapitanes').innerText =
                    `Capitanes: ${capitanesEncontrados.join(', ')}`;
            }
        }

        function girarRuleta() {
            if (girando) return;
            if (tiradaActual >= capitanesObjetivo.length) return; // ya no quedan tiradas

            girando = true;
            document.getElementById('resultado').innerText = "";
            document.getElementById('btnGirar').disabled = true;

            // Nombre que debe salir en esta tirada
            const nombreGanador = capitanesObjetivo[tiradaActual];
            const ganadorIndex = nombresRestantes.indexOf(nombreGanador);

            if (ganadorIndex === -1) {
                // El nombre configurado no está en la lista de restantes (typo o ya salió antes)
                document.getElementById('resultado').innerText =
                    `⚠️ "${nombreGanador}" no está en la ruleta de esta mesa.`;
                girando = false;
                document.getElementById('btnGirar').disabled = false;
                return;
            }

            let vueltasExtra = 5;
            const anguloPorSector = 2 * Math.PI / numSectores;

            const centroSectorGanador = (ganadorIndex * anguloPorSector) + (anguloPorSector / 2);
            let anguloFinalObjetivo = (2 * Math.PI * vueltasExtra) + ((3 * Math.PI / 2) - centroSectorGanador) + anguloActual;

            canvas.classList.remove('sin-transicion');
            canvas.style.transform = `rotate(${anguloFinalObjetivo}rad)`;

            setTimeout(() => {
                girando = false;
                anguloActual = anguloFinalObjetivo % (2 * Math.PI);

                capitanesEncontrados.push(nombreGanador);
                tiradaActual++;

                const quedanTiradas = tiradaActual < capitanesObjetivo.length;

                if (quedanTiradas) {
                    document.getElementById('resultado').innerText =
                        `🎉 ¡Capitán ${tiradaActual}: ${nombreGanador}! 🎉`;
                } else {
                    document.getElementById('resultado').innerText =
                        capitanesObjetivo.length > 1
                            ? `🎉 ¡Último capitán: ${nombreGanador}! 🎉`
                            : `🎉 ¡Capitán: ${nombreGanador}! 🎉`;
                }
                actualizarListaCapitanes();

                // Quitar al ganador de la ruleta y redibujar sin animación de transform
                nombresRestantes.splice(ganadorIndex, 1);

                if (nombresRestantes.length > 0) {
                    canvas.classList.add('sin-transicion');
                    anguloActual = 0;
                    canvas.style.transform = `rotate(0rad)`;
                    // Forzar reflow para que el cambio de transform sin transición se aplique ya
                    void canvas.offsetWidth;
                    dibujarRuleta();
                }

                if (quedanTiradas) {
                    document.getElementById('btnGirar').innerText = `¡GIRAR de nuevo (capitán ${tiradaActual + 1})!`;
                    document.getElementById('btnGirar').disabled = false;
                } else {
                    document.getElementById('btnGirar').innerText = "¡Ya están todos los capitanes!";
                    document.getElementById('btnGirar').disabled = true;
                }
            }, 4000);
        }

        dibujarRuleta();
    </script>
</body>
</html>
