<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sorteo por Mesas</title>
</head>
<body>
    <h1>Selecciona tu Mesa</h1>
    <form id="mesaForm">
        <label for="numMesa">Número de mesa:</label>
        <input type="number" id="numMesa" required min="1">
        <button type="submit">Ir a la Ruleta</button>
    </form>

    <script>
        document.getElementById('mesaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const mesa = document.getElementById('numMesa').value;
            // Redirige a la ruleta pasando la mesa por la URL
            window.location.href = `ruleta.html?mesa=${mesa}`;
        });
    </script>
</body>
</html>
