<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteo - Selecciona tu Mesa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 10px; font-size: 2rem; }
        p { margin-bottom: 30px; font-size: 1.1rem; opacity: 0.9; }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }
        input {
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 30px;
            border: none;
            text-align: center;
            outline: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            background-color: #ffcc00;
            color: #333;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        button:hover { background-color: #ffd633; }
    </style>
</head>
<body>

    <h1>Descubre al capitán</h1>
    <p>Introduce tu número de mesa para continuar:</p>
    
    <form id="mesaForm">
        <input type="number" id="numMesa" placeholder="Ej. 1, 2, 3..." required min="1">
        <button type="submit">Continuar</button>
    </form>

    <script>
        document.getElementById('mesaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const mesa = document.getElementById('numMesa').value;
            // Redirige a la ruleta pasando el número de mesa en la URL
            window.location.href = `ruleta.html?mesa=${mesa}`;
        });
    </script>
</body>
</html>
