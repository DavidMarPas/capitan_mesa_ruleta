<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubre al capitán de tu mesa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 { margin-bottom: 5px; font-size: 1.8rem; }
        #subtituloMesa { font-size: 1.1rem; color: #ffcc00; margin-bottom: 20px; font-weight: bold; }
        .ruleta-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 10px auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .flecha {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #ffcc00;
            z-index: 10;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
        }
        button {
            background-color: #ffcc00;
            color: #333;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
            margin-top: 15px;
        }
        button:active { transform: scale(0.95); }
        button:hover { background-color: #ffd633; }
        #resultado {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            min-height: 40px;
            color: #ffcc00;
        }
        .volver {
            margin-top: 15px;
            background: none;
            border: 2px solid white;
            color: white;
            padding: 8px 20px;
            font-size: 0.9rem;
            border-radius: 20px;
        }
        .volver:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

    <h1>Descubre al capitán</h1>
    <div id="subtituloMesa">Mesa X</div>
    
    <div class="ruleta-container">
        <div class="flecha"></div>
        <canvas id="canvasRuleta" width="400" height="400"></canvas>
    </div>

    <button id="btnGirar" onclick="girarRuleta()">¡GIRAR!</button>
    <div id="resultado"></div>
    
    <button class="volver" onclick="window.location.href='index.html'">Cambiar de mesa</button>

    <script>
        // 1. Capturar el número de mesa de la URL (por defecto la mesa 1 si no hay nada)
        const urlParams = new URLSearchParams(window.location.search);
        const numeroMesa = urlParams.get('mesa') || '1';
        document.getElementById('subtituloMesa').innerText = `Mesa número ${numeroMesa}`; // se corrige abajo en el DOM
        document.getElementById('subtituloMesa').innerText = `Mesa ${numeroMesa}`;

        // 2. Definir las listas de nombres por cada mesa y quién gana (índice del 0 en adelante)
        const configuracionMesas = {
            "1": {
                nombres: ["Loli", "Marta", "Alejandro", "Celia","Rocío", "Aarón", "Mireia", "Pedro"],
                ganadorIndex: 0 // Gana Loli
            },
            "2": {
                nombres: ["Rocío", "Aarón", "Mireia", "Pedro"],
                ganadorIndex: 0
            },
            "3": {
                nombres: ["Sofía", "Lucas", "Mateo", "Lucía", "Carlos"],
                ganadorIndex: 0
            }
        };

        // Si la mesa introducida no está en el listado, ponemos una por defecto para que no falle
        const datosMesa = configuracionMesas[numeroMesa] || {
            nombres: ["Participante 1", "Participante 2", "Participante 3"],
            ganadorIndex: 0
        };

        const nombres = datosMesa.nombres;
        let ganadorFijoIndex = datosMesa.ganadorIndex;
        
        // Configuración de la ruleta
        const canvas = document.getElementById('canvasRuleta');
        const ctx = canvas.getContext('2d');
        const numSectores = nombres.length;
        const arco = 2 * Math.PI / numSectores;
        let anguloActual = 0;
        let girando = false;

        const colores = [
            "#e74c3c", "#3498db", "#2ecc71", "#f1c40f", 
            "#9b59b6", "#e67e22", "#1abc9c", "#34495e", 
            "#d35400", "#27ae60", "#2980b9", "#8e44ad"
        ];

        function dibujarRuleta() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centro = canvas.width / 2;
            const radio = centro - 10;

            for (let i = 0; i < numSectores; i++) {
                const anguloInicio = anguloActual + i * arco;
                const anguloFin = anguloInicio + arco;

                ctx.beginPath();
                ctx.moveTo(centro, centro);
                ctx.arc(centro, centro, radio, anguloInicio, anguloFin);
                ctx.fillStyle = colores[i % colores.length];
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(centro, centro);
                ctx.rotate(anguloInicio + arco / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 16px sans-serif";
                ctx.fillText(nombres[i], radio - 20, 6);
                ctx.restore();
            }
        }

        function girarRuleta() {
            if (girando) return;
            girando = true;
            document.getElementById('resultado').innerText = "";

            let vueltasExtra = 5; 
            const anguloPorSector = 2 * Math.PI / numSectores;
            
            const centroSectorGanador = (ganadorFijoIndex * anguloPorSector) + (anguloPorSector / 2);
            let anguloFinalObjetivo = (2 * Math.PI * vueltasExtra) + ((3 * Math.PI / 2) - centroSectorGanador);

            canvas.style.transform = `rotate(${anguloFinalObjetivo}rad)`;

            setTimeout(() => {
                girando = false;
                anguloActual = anguloFinalObjetivo % (2 * Math.PI);
                document.getElementById('resultado').innerText = `🎉 ¡Capitán: ${nombres[ganadorFijoIndex]}! 🎉`;
            }, 4000);
        }

        dibujarRuleta();
    </script>
</body>
</html>
